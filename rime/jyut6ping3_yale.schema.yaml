# Rime schema
# encoding: utf-8
#
# rime-google-cantonese：粵語拼音（耶魯版）＋ Google「廣東話」雲端候選
#
# 拼寫規則（speller/algebra）來自 CanCLID/rime-cantonese-schemes
# 「耶魯拼音方案」補丁（LGPL-3.0），作者：幸延 <a0726h77@gmail.com>、亶父 <tanxpyox@gmail.com>，
# 改編自 rime/rime-jyutping 的 yale.schema.yaml。
#
# 原補丁是 jyut6ping3.custom.yaml，會取代粵拼；這裏做成獨立方案 jyut6ping3_yale，
# 所以可以和粵拼 jyut6ping3 並存，用 Ctrl+` 或 F4 切換。
# 透過 __include 會一併繼承 jyut6ping3.custom.yaml 的 Google 插件元件，下面再覆寫 gcloud 設定。

__include: jyut6ping3.schema:/

schema:
  schema_id: jyut6ping3_yale
  name: 粵語拼音（耶魯）
  version: "2026.11.04"
  author:
    - 幸延 <a0726h77@gmail.com>
    - 亶父 <tanxpyox@gmail.com>
    - rime-cantonese contributors
  description: |-
    粵拼方案加上耶魯拼音拼寫（j = 粵拼 z，ch = 粵拼 c，eu = 粵拼 eo/oe，y = 粵拼 j）
    拼寫補丁：https://github.com/CanCLID/rime-cantonese-schemes
    不支援耶魯拼音的聲調寫法（例如 yaht 中的 h），聲調仍以 v/x/q 輸入
  dependencies:
    - luna_pinyin
    - loengfan
    - stroke
    - cangjie5

__patch:
  # 拼寫規則不同，須使用獨立的 prism，不可與 jyut6ping3 共用
  translator/prism: jyut6ping3_yale
  speller/algebra/+:
    - derive/oe|eo/eu/                               # 信 seon -> seun
    - erase/j.*/                                     # 刪除原有 j 聲母，以免混淆
    - derive/^z/j/                                   # 渣 zaa  -> ja
    - derive/^c/ch/                                  # 叉 caa  -> cha
  # 原補丁會在輸入欄以括號顯示對應的粵拼（方便過渡至粵拼），本方案不採用：輸入欄只顯示用家輸入的耶魯拼法。
  # 候選字旁的拼音提示（spelling_hints）原為詞庫的粵拼，在此轉換為耶魯拼法（聲調仍以數字表示）。
  translator/comment_format:
    - xform/(?<![a-z])jyu/yu/                        # 月 jyut -> yut，魚 jyu -> yu
    - xform/(?<![a-z])j/y/                           # 日 jat  -> yat
    - xform/(?<![a-z])z/j/                           # 住 zyu  -> jyu
    - xform/(?<![a-z])c/ch/                          # 茶 caa  -> cha
    - xform/eoi/eui/                                 # 去 heoi -> heui
    - xform/oe|eo/eu/                                # 香 hoeng -> heung，信 seon -> seun
    - xform/aa(?=[1-6])/a/                           # 花 faa  -> fa
  # Google 插件：小狼毫為主，連按兩下左 Shift 先加入 Google；用 Google「廣東話」（耶魯）引擎
  gcloud/mode: rime_first
  gcloud/engine: yale
