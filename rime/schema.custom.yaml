# rime-google-cantonese：Google 粵語雲端候選
# 安裝程式會把本檔複製成 <schema_id>.custom.yaml（例如 jyut6ping3.custom.yaml）。
patch:
  "switches/@next":
    name: gcloud_off
    states: [ ☁雲端, 本地 ]
  # 處理器須排在 ascii_composer 之前，才能攔截雙擊 Shift
  "engine/processors/@before 0": lua_processor@gcloud_processor
  "engine/translators/@before 0": lua_translator@gcloud_translator
  # filter 須排在最前（繁簡轉換、emoji 及 uniquifier 之前），cloud_only 模式才能隱藏小狼毫候選
  "engine/filters/@before 0": lua_filter@gcloud_filter
  # rime_slot 模式使用：排在最後（uniquifier 之後），把 Google 的首個候選放入第一頁最後一格
  "engine/filters/@next": lua_filter@gcloud_slot_filter
  # rime_slot 模式使用：每頁 6 個候選，第 6 個保留給 Google（安裝程式選用 rime_slot 時會自動啟用下一行）
  # "menu/page_size": 6
  gcloud:
    mode: rime_first        # rime_first  = 平時只顯示小狼毫候選，雙擊 Shift 時加入 Google 候選
                            # rime_slot   = 與 rime_first 相同，另外第一頁最後一格固定為 Google 的首個候選
                            # cloud_first = 平時 Google 候選在前，小狼毫候選在後
                            # cloud_only  = 有 Google 結果時只顯示 Google 候選，未有結果時顯示小狼毫候選
                            # 四種模式下，雙擊 Shift 均會反轉當時正在輸入的拼音的顯示方式
    double_shift: true      # 輸入期間快速連按兩下左 Shift，反轉上述模式
    double_shift_ms: 500    # 兩下 Shift 之間的最長間隔（毫秒）
    trigger: none           # 另行指定單鍵觸發（例如 Tab）；none 表示不使用
    push_refresh: true      # rime_slot／cloud_first／cloud_only：Google 結果到達時，由背景程式發送 F24 提示刷新
    refresh_key: F24        # 背景程式使用的刷新鍵（須與 daemon/RimeGcloud.cs 的 VK_F24 一致）
    timeout_ms: 1500        # 雙擊 Shift 要求雲端候選後的最長等待時間（毫秒）
    prefetch: auto          # auto = rime_first 只在雙擊 Shift 時查詢；其他模式在輸入期間預先查詢
                            # true / false = 強制開啟／關閉
    show_annotation: true   # 在候選後顯示 Google 的拼音註解
    max_candidates: 15
